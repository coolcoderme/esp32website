<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Snake</title>
<link rel="stylesheet" href="/css/style.css">
</head>
<body>
<div class="wrap" id="app"></div>
<script src="/games/common/leaderboard.js"></script>
<script>
const GAME = "snake";
document.getElementById("app").innerHTML = gameHeader("Snake") + `
  <div class="grid cols-2">
    <div class="card game-shell">
      <div class="game-hud">Score: <b id="score">0</b> &nbsp; Best: <b id="best">0</b></div>
      <canvas id="c" width="360" height="360"></canvas>
      <div class="muted">Arrow keys / WASD &middot; or tap the buttons</div>
      <div class="row center">
        <button class="btn secondary small" data-d="up">&#9650;</button>
        <button class="btn secondary small" data-d="left">&#9664;</button>
        <button class="btn secondary small" data-d="down">&#9660;</button>
        <button class="btn secondary small" data-d="right">&#9654;</button>
      </div>
      <button class="btn" id="start">Start / Restart</button>
    </div>
    <div class="card"><h3>Leaderboard</h3><div id="lb"></div></div>
  </div>`;

const cv = document.getElementById("c"), ctx = cv.getContext("2d");
const N = 18, S = cv.width / N;
let snake, dir, food, score, alive, loop, best = 0;

function reset() {
  snake = [{x: 9, y: 9}]; dir = {x: 1, y: 0}; score = 0; alive = true;
  placeFood(); document.getElementById("score").textContent = 0;
  if (loop) clearInterval(loop);
  loop = setInterval(step, 110);
}
function placeFood() {
  do { food = {x: (Math.random()*N)|0, y: (Math.random()*N)|0}; }
  while (snake.some(s => s.x===food.x && s.y===food.y));
}
function step() {
  if (!alive) return;
  const head = {x: snake[0].x + dir.x, y: snake[0].y + dir.y};
  if (head.x<0||head.y<0||head.x>=N||head.y>=N||snake.some(s=>s.x===head.x&&s.y===head.y)) {
    return gameOver();
  }
  snake.unshift(head);
  if (head.x===food.x && head.y===food.y) {
    score += 10; document.getElementById("score").textContent = score;
    best = Math.max(best, score); document.getElementById("best").textContent = best;
    placeFood();
  } else { snake.pop(); }
  draw();
}
function draw() {
  ctx.fillStyle = "#060a14"; ctx.fillRect(0,0,cv.width,cv.height);
  ctx.fillStyle = "#f87171"; ctx.fillRect(food.x*S+2, food.y*S+2, S-4, S-4);
  snake.forEach((s,i) => {
    ctx.fillStyle = i===0 ? "#22d3ee" : "#5b8cff";
    ctx.fillRect(s.x*S+1, s.y*S+1, S-2, S-2);
  });
}
async function gameOver() {
  alive = false; clearInterval(loop);
  ctx.fillStyle = "rgba(0,0,0,.6)"; ctx.fillRect(0,0,cv.width,cv.height);
  ctx.fillStyle = "#fff"; ctx.font = "24px system-ui"; ctx.textAlign = "center";
  ctx.fillText("Game Over", cv.width/2, cv.height/2);
  if (score > 0) await LB.recordAndRefresh(GAME, score, document.getElementById("lb"));
}
function setDir(d) {
  const m = {up:{x:0,y:-1},down:{x:0,y:1},left:{x:-1,y:0},right:{x:1,y:0}}[d];
  if (m && (m.x !== -dir.x || m.y !== -dir.y)) dir = m;
}
document.addEventListener("keydown", e => {
  const k = {ArrowUp:"up",ArrowDown:"down",ArrowLeft:"left",ArrowRight:"right",
             w:"up",s:"down",a:"left",d:"right"}[e.key];
  if (k) { e.preventDefault(); setDir(k); }
});
document.querySelectorAll("[data-d]").forEach(b => b.onclick = () => setDir(b.dataset.d));
document.getElementById("start").onclick = reset;

LB.get(GAME).then(l => LB.render(document.getElementById("lb"), l));
reset();
</script>
</body>
</html>
