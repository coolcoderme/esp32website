<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Calculator</title>
<link rel="stylesheet" href="/css/style.css">
<style>
  #display { font-size:30px; text-align:right; padding:16px; min-height:30px; word-break:break-all; }
  #keys { display:grid; grid-template-columns:repeat(4,1fr); gap:8px; }
  #keys button { padding:16px; font-size:18px; border-radius:12px; border:1px solid var(--border);
                 background:var(--card2); color:var(--text); cursor:pointer; }
  #keys button:hover { border-color:var(--accent); }
  #keys .op { background:#22314f; color:var(--accent2); }
  #keys .eq { background:var(--accent); color:#06121f; font-weight:800; }
  #keys .fn { font-size:14px; }
</style>
</head>
<body>
<div class="wrap">
  <header class="site"><div class="brand"><div class="logo">E32</div>
    <div><h1>Calculator</h1><p><a class="back" href="/#tools">&larr; Back to tools</a></p></div></div></header>
  <div class="card" style="max-width:420px;margin:0 auto">
    <div id="display" class="mono">0</div>
    <div id="keys"></div>
    <p class="muted center" style="margin-top:12px">Scientific: sin cos tan log ln sqrt ^ ( ) &pi;. Keyboard supported.</p>
  </div>
</div>
<script>
const keys=[
 ["sin","cos","tan","C","fn"],["log","ln","sqrt","DEL","fn"],
 ["7","8","9","/","op"],["4","5","6","*","op"],["1","2","3","-","op"],
 ["0",".","^","+","op"],["(",")","\u03c0","=","eq"]
];
const disp=document.getElementById("display"); let expr="";
const kg=document.getElementById("keys");
keys.forEach(row=>{
  const cls=row[4];
  row.slice(0,4).forEach(k=>{
    const b=document.createElement("button"); b.textContent=k;
    if(cls==="op" && ["/","*","-","+"].includes(k)) b.className="op";
    if(cls==="eq" && k==="=") b.className="eq";
    if(["sin","cos","tan","log","ln","sqrt"].includes(k)) b.className="fn";
    b.onclick=()=>hit(k); kg.appendChild(b);
  });
});
function hit(k){
  if(k==="C") expr="";
  else if(k==="DEL") expr=expr.slice(0,-1);
  else if(k==="=") calc();
  else if(k==="\u03c0") expr+="pi";
  else if(["sin","cos","tan","log","ln","sqrt"].includes(k)) expr+=k+"(";
  else expr+=k;
  render();
}
function render(){ disp.textContent=expr||"0"; }
function calc(){
  try{
    let s=expr.replace(/\u03c0|pi/g,"Math.PI")
      .replace(/\bsin\(/g,"Math.sin(").replace(/\bcos\(/g,"Math.cos(")
      .replace(/\btan\(/g,"Math.tan(").replace(/\blog\(/g,"Math.log10(")
      .replace(/\bln\(/g,"Math.log(").replace(/\bsqrt\(/g,"Math.sqrt(")
      .replace(/\^/g,"**");
    if(/[^0-9+\-*/(). eMathPILsincotaqrgl0]/.test(s.replace(/Math\.\w+/g,""))){}
    const val=Function('"use strict";return ('+s+')')();
    expr=(Math.round(val*1e10)/1e10).toString();
  }catch(e){ expr="Error"; }
}
document.addEventListener("keydown",e=>{
  if(/[0-9+\-*/().^]/.test(e.key)) { expr+=e.key; render(); }
  else if(e.key==="Enter"){ e.preventDefault(); calc(); render(); }
  else if(e.key==="Backspace"){ expr=expr.slice(0,-1); render(); }
  else if(e.key==="Escape"){ expr=""; render(); }
});
render();
</script>
</body>
</html>
