<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pomodoro Study Timer</title>
<link rel="stylesheet" href="/css/style.css">
<style>
  #time { font-size:72px; font-weight:800; letter-spacing:2px; }
  .phase { font-size:15px; letter-spacing:.15em; text-transform:uppercase; }
</style>
</head>
<body>
<div class="wrap">
  <header class="site"><div class="brand"><div class="logo">E32</div>
    <div><h1>Pomodoro Study Timer</h1><p><a class="back" href="/#tools">&larr; Back to tools</a></p></div></div></header>
  <div class="card center" style="max-width:460px;margin:0 auto">
    <div class="phase muted" id="phase">Focus</div>
    <div id="time" class="mono">25:00</div>
    <div class="muted">Completed focus sessions: <b id="count">0</b></div>
    <div class="gap"></div>
    <div class="row center">
      <button class="btn" id="startstop">Start</button>
      <button class="btn secondary" id="reset">Reset</button>
      <button class="btn secondary" id="skip">Skip</button>
    </div>
    <div class="gap"></div>
    <div class="row">
      <div style="flex:1"><label>Focus (min)</label><input type="number" id="focusMin" value="25" min="1"></div>
      <div style="flex:1"><label>Short break</label><input type="number" id="shortMin" value="5" min="1"></div>
      <div style="flex:1"><label>Long break</label><input type="number" id="longMin" value="15" min="1"></div>
    </div>
    <p class="muted" style="margin-top:12px">A long break follows every 4 focus sessions.</p>
  </div>
</div>
<script>
let remaining=25*60, running=false, phase="focus", count=0, timer;
const $=id=>document.getElementById(id);
function mins(id){ return Math.max(1,parseInt($(id).value)||1); }
function dur(){ return phase==="focus"?mins("focusMin")*60 : phase==="short"?mins("shortMin")*60 : mins("longMin")*60; }
function label(){ return phase==="focus"?"Focus":phase==="short"?"Short Break":"Long Break"; }
function render(){
  const m=(remaining/60|0), s=remaining%60;
  $("time").textContent=`${String(m).padStart(2,"0")}:${String(s).padStart(2,"0")}`;
  $("phase").textContent=label(); document.title=$("time").textContent+" - Pomodoro";
}
function beep(){ try{ const a=new (window.AudioContext||window.webkitAudioContext)();
  const o=a.createOscillator(),g=a.createGain(); o.connect(g); g.connect(a.destination);
  o.frequency.value=660; g.gain.value=.2; o.start(); o.stop(a.currentTime+.4);}catch(e){} }
function tick(){
  if(remaining>0){ remaining--; render(); return; }
  beep();
  if(phase==="focus"){ count++; $("count").textContent=count;
    phase=(count%4===0)?"long":"short"; }
  else phase="focus";
  remaining=dur(); render();
}
function toggle(){
  running=!running;
  $("startstop").textContent=running?"Pause":"Start";
  if(running) timer=setInterval(tick,1000); else clearInterval(timer);
}
$("startstop").onclick=toggle;
$("reset").onclick=()=>{ clearInterval(timer); running=false; phase="focus"; remaining=dur();
  $("startstop").textContent="Start"; render(); };
$("skip").onclick=()=>{ remaining=0; tick(); };
["focusMin","shortMin","longMin"].forEach(id=>$(id).addEventListener("input",()=>{ if(!running){ remaining=dur(); render(); } }));
render();
</script>
</body>
</html>
